      <text x="107" y="112" fill="#fff" font-size="24" text-anchor="middle" font-weight="700">Certifications</text>
    </g>
    <g transform="translate(490 0)">
      <rect x="0" y="0" width="215" height="150" rx="24" fill="#0f2a45" stroke="#22d3ee" stroke-opacity=".5"/>
      <circle cx="107" cy="50" r="23" fill="#22d3ee" filter="url(#glow)"/>
      <text x="107" y="112" fill="#fff" font-size="24" text-anchor="middle" font-weight="700">Badges</text>
    </g>
    <g transform="translate(735 0)">
