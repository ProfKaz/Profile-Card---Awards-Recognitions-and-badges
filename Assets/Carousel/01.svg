<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152e"/>
      <stop offset="0.55" stop-color="#0a2348"/>
      <stop offset="1" stop-color="#140b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1122" height="1402" fill="url(#bg)"/>
  <circle cx="930" cy="210" r="250" fill="#5b21b6" opacity=".14"/>
  <circle cx="170" cy="1180" r="250" fill="#0284c7" opacity=".12"/>

  <text x="86" y="118" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2">MICROSOFT 365 PROFILE CARDS</text>
  <text x="86" y="245" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800">
    <tspan x="86" dy="0">Do you really know</tspan>
    <tspan x="86" dy="86">what your team is</tspan>
    <tspan x="86" dy="86">certified to do?</tspan>
  </text>

  <text x="86" y="540" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="32">
    Make verified capabilities visible where people already work.
  </text>

  <g transform="translate(86 625)">
