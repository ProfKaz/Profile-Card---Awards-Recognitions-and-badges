    <circle cx="92" cy="98" r="32" fill="url(#accent)"/>
    <rect x="142" y="73" width="160" height="16" rx="8" fill="#dbeafe"/>
    <rect x="142" y="105" width="120" height="12" rx="6" fill="#7dd3fc" opacity=".8"/>

    <rect x="385" y="38" width="529" height="120" rx="20" fill="#101f45"/>
    <text x="420" y="82" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Awards &amp; certifications</text>
    <circle cx="438" cy="125" r="18" fill="#60a5fa"/>
    <circle cx="492" cy="125" r="18" fill="#a78bfa"/>
    <circle cx="546" cy="125" r="18" fill="#22d3ee"/>
    <circle cx="600" cy="125" r="18" fill="#818cf8"/>
    <rect x="640" y="116" width="210" height="18" rx="9" fill="#334155"/>

    <rect x="36" y="192" width="878" height="136" rx="20" fill="#0b2344"/>
    <text x="72" y="238" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Verified skills visibility</text>
    <text x="72" y="279" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="23">Microsoft Learn + Credly → Microsoft 365 People Profile</text>
    <text x="72" y="315" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="21">Discover expertise for staffing, delivery and Copilot-assisted search.</text>
  </g>

  <g transform="translate(86 1080)" font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="0" y="0" width="215" height="150" rx="24" fill="#0e2b52" stroke="#38bdf8" stroke-opacity=".45"/>
      <circle cx="107" cy="50" r="23" fill="#38bdf8" filter="url(#glow)"/>
      <text x="107" y="112" fill="#fff" font-size="24" text-anchor="middle" font-weight="700">Awards</text>
    </g>
